[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kestrel"
version = "0.1.0"
description = "Deterministic Terraform plan risk analysis with a bounded read-only agent loop."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kestrel contributors" }]
dependencies = ["boto3>=1.34", "httpx>=0.27", "langgraph>=0.2", "pydantic>=2.7", "rich>=13.7", "typer>=0.12"]

[project.scripts]
kestrel = "kestrel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kestrel"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]